name: update-menu

on:
  schedule:
    # UTC指定。JST 10:27 / 13:27 / 16:27 に相当（1日3回）
    # GitHub cronは"ちょうどの時刻(0分)"だと混雑で遅延/スキップされやすいので、
    # 分を27にずらし & 回数を3回にして「どれかは走る」確実性を上げる。
    # 同じ画像はキャッシュで課金ゼロなので回数を増やしてもコストは増えない。
    - cron: "27 1,4,7 * * *"
  workflow_dispatch: {}   # 手動実行ボタンも有効化

permissions:
  contents: write
  issues: write   # 失敗時に自動でIssueを起票するため

# 同時実行を防ぐ（cronと手動が重なっても1本に）
concurrency:
  group: update-menu
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 初回復旧runはキャッシュ全枯れ＋mkldnn無効でCPU推論が遅いので余裕を持たせる
    # （2回目以降はキャッシュヒットで数枚/日に戻る）
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ocr.txt

      - name: Install deps
        run: pip install -r requirements-ocr.txt

      # 純関数テスト（paddle不要の高速ゲート）。分類器/パーサの回帰をここで即検出。
      # 落ちれば以降のBuild/pushに到達せず、Pagesは直前の良版のまま残る。
      - name: Unit tests (pure functions)
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/ --ignore=tests/test_smoke_ocr.py -q

      # PaddleOCR のモデルは初回に ~/.paddlex へダウンロードされるのでキャッシュする
      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: |
            ~/.paddlex
            ~/.paddleocr
          key: paddle-models-${{ hashFiles('requirements-ocr.txt') }}

      # OCRスモークテスト: 固定画像で実推論し、料理が取れなければ即fail。
      # paddle 3.3.x oneDNN/PIRバグ型の「CIでだけOCR全滅」を毎run・Build前に検出する。
      - name: OCR smoke test
        run: python -m pytest tests/test_smoke_ocr.py -q

      - name: Build index.html
        env:
          # GitHub外の死活監視(healthchecks.io等)へ正常完了をping。
          # 未設定ならbuild_ocr.py側でno-op。cron停止など「ジョブが走らない」系を外部で検知する。
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: python build_ocr.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cache/
          if git diff --staged --quiet; then
            echo "変更なし（メニュー更新なし）"
          else
            git commit -m "🤖 学食メニュー自動更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST'))"
            git push
            echo "✅ 更新をpushした"
          fi

      # いずれかのステップが失敗したらIssueを自動起票（通知の一次経路）。
      # GitHubの標準失敗メールは最終コミッター依存で脆いので、Issueを正にする。
      # open中の同ラベルIssueがあれば重複起票しない。
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ci-failure --color b60205 --description "update-menu CI失敗" 2>/dev/null || true
          open=$(gh issue list --label ci-failure --state open --json number --jq '.[].number')
          if [ -z "$open" ]; then
            gh issue create \
              --title "🚨 update-menu 失敗 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST'))" \
              --label ci-failure \
              --body "update-menu が失敗しました。健全性ゲート/OCRスモーク/純関数テスト/Buildのいずれかが赤です。ログ: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            echo "既存のci-failure Issue #$open があるため起票をスキップ"
          fi
